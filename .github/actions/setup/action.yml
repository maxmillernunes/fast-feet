name: Setup Node and dependencies
description: Shared setup for all CI jobs (checkout, pnpm, Node, install, prisma generate)
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 11

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm prisma generate
      shell: bash
